<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="250" cy="200" r="145" fill="#ffffff" stroke="#1c398e" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Outer Gear / Cog Notches around Circle -->
  <g stroke="#1c398e" stroke-width="4" stroke-linecap="round">
    <!-- 24 radial notches around outer perimeter -->
    <line x1="250" y1="46" x2="250" y2="55" stroke-width="6" />
    <line x1="288" y1="51" x2="286" y2="60" stroke-width="6" />
    <line x1="324" y1="66" x2="320" y2="74" stroke-width="6" />
    <line x1="355" y1="89" x2="349" y2="96" stroke-width="6" />
    <line x1="380" y1="119" x2="372" y2="124" stroke-width="6" />
    <line x1="395" y1="154" x2="386" y2="157" stroke-width="6" />
    <line x1="400" y1="191" x2="391" y2="191" stroke-width="6" />
    <line x1="395" y1="228" x2="386" y2="225" stroke-width="6" />
    <line x1="380" y1="263" x2="372" y2="258" stroke-width="6" />
    <line x1="355" y1="293" x2="349" y2="286" stroke-width="6" />
    <line x1="324" y1="316" x2="320" y2="308" stroke-width="6" />
    <line x1="288" y1="331" x2="286" y2="322" stroke-width="6" />
    <line x1="250" y1="336" x2="250" y2="327" stroke-width="6" />
    <line x1="212" y1="331" x2="214" y2="322" stroke-width="6" />
    <line x1="176" y1="316" x2="180" y2="308" stroke-width="6" />
    <line x1="145" y1="293" x2="151" y2="286" stroke-width="6" />
    <line x1="120" y1="263" x2="128" y2="258" stroke-width="6" />
    <line x1="105" y1="228" x2="114" y2="225" stroke-width="6" />
    <line x1="100" y1="191" x2="109" y2="191" stroke-width="6" />
    <line x1="105" y1="154" x2="114" y2="157" stroke-width="6" />
    <line x1="120" y1="119" x2="128" y2="124" stroke-width="6" />
    <line x1="145" y1="89" x2="151" y2="96" stroke-width="6" />
    <line x1="176" y1="66" x2="180" y2="74" stroke-width="6" />
    <line x1="212" y1="51" x2="214" y2="60" stroke-width="6" />
  </g>

  <!-- Inner Double Ring -->
  <circle cx="250" cy="200" r="132" fill="none" stroke="#1c398e" stroke-width="3" />
  <circle cx="250" cy="200" r="126" fill="none" stroke="#1c398e" stroke-width="1.5" />

  <!-- Bold Serif Monogram: JAN in Red (#dc2626) -->
  <g fill="#dc2626" font-family="'Times New Roman', Times, Georgia, serif" font-weight="900" text-anchor="middle">
    <!-- J letter -->
    <text x="175" y="240" font-size="140" letter-spacing="-2">J</text>
    <!-- A letter in center (large, prominent) -->
    <text x="248" y="240" font-size="160" letter-spacing="-1">A</text>
    <!-- N letter on right -->
    <text x="325" y="240" font-size="140" letter-spacing="-2">N</text>
  </g>

  <!-- Ribbon Banner Below Circle -->
  <!-- Back folds / Fishtail Left -->
  <polygon points="60,335 110,310 110,365 60,380 80,355" fill="#132560" />
  <!-- Back folds / Fishtail Right -->
  <polygon points="440,335 390,310 390,365 440,380 420,355" fill="#132560" />

  <!-- Front Curved Ribbon -->
  <path d="M 90,325 Q 250,375 410,325 L 405,375 Q 250,425 95,375 Z" fill="#203a8f" stroke="#ffffff" stroke-width="2" filter="url(#shadow)" />

  <!-- Ribbon Text: ★ TRANSPORT & CONT. ★ -->
  <g fill="#ffffff" font-family="'Cabinet Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="21" text-anchor="middle" letter-spacing="2">
    <text x="135" y="365" font-size="18">★</text>
    <text x="250" y="368">TRANSPORT &amp; CONT.</text>
    <text x="365" y="365" font-size="18">★</text>
  </g>

  <!-- Text Below: JABAL AL NOOR in Heavy Red -->
  <text x="250" y="442" fill="#e11d48" font-family="'Cabinet Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="44" text-anchor="middle" letter-spacing="1">
    JABAL AL NOOR
  </text>

  <!-- Subtitle: TRANSPORT & CONTRACTING L.L.C in Navy Blue -->
  <text x="250" y="482" fill="#1c398e" font-family="'Cabinet Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="24" text-anchor="middle" letter-spacing="1.5">
    TRANSPORT &amp; CONTRACTING L.L.C
  </text>
</svg>
